services:
  app:
    build: .
    container_name: whatsapp-gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - sessions:/app/sessions
      - webhooks:/app/webhooks
      - data:/app/data
    restart: unless-stopped
    networks:
      - shared-network

volumes:
  sessions:
  webhooks:
  data:

networks:
  shared-network:
    external: true
